version: "3.9"

services:
  nexavault-api:
    build: .
    container_name: nexavault-loan-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./app:/nexavault/app
      - ./logs:/nexavault/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexavault-net

  # Optional: reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - nexavault-api
  #   networks:
  #     - nexavault-net

networks:
  nexavault-net:
    driver: bridge
